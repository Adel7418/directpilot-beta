name: directpilot-p2-test

services:
  postgres:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_DB: ${DIRECTPILOT_POSTGRES_DB:?set an isolated test database name}
      POSTGRES_USER: directpilot_owner
      POSTGRES_PASSWORD: ${DIRECTPILOT_POSTGRES_OWNER_PASSWORD:?set an isolated synthetic test password}
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
    ports:
      - "127.0.0.1:${DIRECTPILOT_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directpilot_owner -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - directpilot_test_postgres_data:/var/lib/postgresql/data
    networks:
      - directpilot_test

networks:
  directpilot_test: {}

volumes:
  directpilot_test_postgres_data:
