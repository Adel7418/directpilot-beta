name: directpilot-p2-dev

services:
  postgres:
    image: postgres:17.7-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DIRECTPILOT_POSTGRES_DB:?set a development database name}
      POSTGRES_USER: directpilot_owner
      POSTGRES_PASSWORD: ${DIRECTPILOT_POSTGRES_OWNER_PASSWORD:?set a non-production development password}
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
    ports:
      - "127.0.0.1:${DIRECTPILOT_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directpilot_owner -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - directpilot_dev_postgres_data:/var/lib/postgresql/data
    networks:
      - directpilot_dev

networks:
  directpilot_dev: {}

volumes:
  directpilot_dev_postgres_data:
